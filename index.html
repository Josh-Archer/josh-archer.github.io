<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Josh Archer</title>
  <meta name="description" content="Personal site of Josh Archer, with a link to the GitHub profile.">
  <style>
    :root {
      --bg: #f6f3ec;
      --ink: #1b1916;
      --muted: #534e46;
      --line: #d8d1c4;
      --link: #0f3d2c;
      --link-hover: #0a2a1e;
      --focus: #0f3d2c;
      color-scheme: light;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #161513;
        --ink: #f3efe6;
        --muted: #c4bdb0;
        --line: #3c3832;
        --link: #b7e4cd;
        --link-hover: #e5f7ee;
        --focus: #b7e4cd;
        color-scheme: dark;
      }
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html {
      height: 100%;
      -webkit-text-size-adjust: 100%;
    }

    body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      font-size: 1.125rem;
      line-height: 1.5;
    }

    .skip {
      position: absolute;
      width: 1px;
      height: 1px;
      margin: -1px;
      padding: 0;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
      border: 0;
    }

    .skip:focus {
      position: static;
      align-self: flex-start;
      display: inline-block;
      width: auto;
      height: auto;
      margin: 0 0 1rem;
      padding: 0.65rem 0.9rem;
      overflow: visible;
      clip-path: none;
      white-space: normal;
      background: var(--ink);
      color: var(--bg);
      font-weight: 600;
      text-decoration: underline;
      text-underline-offset: 0.15em;
      outline: 3px solid var(--focus);
      outline-offset: 3px;
    }

    .page {
      display: flex;
      flex-direction: column;
      width: min(100%, 40rem);
      min-height: 100vh;
      min-height: 100dvh;
      margin-inline: auto;
      padding: clamp(1.25rem, 4vw, 3rem);
    }

    header {
      border-top: 3px solid var(--ink);
      padding-top: 0.75rem;
    }

    .domain {
      margin: 0;
      color: var(--muted);
      font-size: 0.8125rem;
      letter-spacing: 0.04em;
    }

    main {
      display: flex;
      flex: 1;
      flex-direction: column;
      justify-content: center;
      padding-block: clamp(2.5rem, 10vh, 6rem);
    }

    main:focus {
      outline: 3px solid var(--focus);
      outline-offset: 0.5rem;
    }

    h1 {
      margin: 0 0 1.25rem;
      padding-bottom: 0.7rem;
      border-bottom: 1px solid var(--line);
      font-family: Georgia, "Iowan Old Style", "Palatino Linotype", Palatino, serif;
      font-size: clamp(2.75rem, 12vw, 5.25rem);
      font-weight: 500;
      letter-spacing: -0.03em;
      line-height: 0.95;
      text-wrap: balance;
      hyphens: manual;
    }

    .lede {
      margin: 0 0 2rem;
      color: var(--muted);
      font-size: 1.25rem;
    }

    nav {
      margin: 0;
    }

    .profile {
      display: inline-grid;
      gap: 0.15rem;
      min-height: 44px;
      padding-block: 0.25rem;
      color: var(--link);
      text-decoration: none;
    }

    .profile .label {
      font-weight: 600;
      text-decoration: underline;
      text-decoration-thickness: 2px;
      text-underline-offset: 0.18em;
    }

    .profile .url {
      color: var(--muted);
      font-size: 1rem;
    }

    .profile:hover .label,
    .profile:focus-visible .label {
      color: var(--link-hover);
      text-decoration-thickness: 3px;
    }

    .profile:focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 4px;
    }

    @media (forced-colors: active) {
      .skip:focus,
      .profile:focus-visible,
      main:focus {
        outline: 3px solid Highlight;
      }
    }

    @media print {
      .skip {
        display: none;
      }

      body {
        background: #fff;
        color: #000;
      }

      .domain,
      .lede,
      .profile,
      .profile .url {
        color: #000;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <a class="skip" href="#content">Skip to content</a>
    <header>
      <p class="domain">josh-archer.github.io</p>
    </header>
    <main id="content" tabindex="-1">
      <h1>Josh Archer</h1>
      <p class="lede">Personal site.</p>
      <nav aria-label="Primary">
        <a class="profile" href="https://github.com/Josh-Archer" rel="me">
          <span class="label">GitHub profile</span>
          <span class="url">github.com/Josh-Archer</span>
        </a>
      </nav>
    </main>
  </div>
</body>
</html>
